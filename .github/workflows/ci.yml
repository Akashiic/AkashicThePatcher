name: CI

# verify: on every push and pull request - release checksums, data/manifest.tsv, and a from-scratch
#         rebuild of the newest builds that have a self-contained build script (beta.38 to beta.42),
#         compared byte for byte with the JARs committed under releases/. Then uploads, as four separate
#         un-zipped artifacts (archive: false), the newest build's JAR, -dev JAR (MCP names), -sources JAR
#         and SHA256SUMS.txt (tools/ci/make_artifacts.py).
# release: on main only, after verify - publishes a GitHub Release (tag on the commit that added the JAR)
#          for every releases/<tag>/ folder that has none yet. See tools/ci/publish_releases.py.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Release checksums
        run: sha256sum -c releases/SHA256SUMS.txt

      - name: Manifest hashes
        run: python3 tools/ci/check_manifest.py

      - name: JDK 8 (gates)
        id: jdk8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: JDK 21 (javac --release 8, build tools)
        id: jdk21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache third-party build inputs
        uses: actions/cache@v4
        with:
          path: ~/thepatcher-libs
          key: thepatcher-libs-${{ hashFiles('tools/ci/fetch_build_libs.sh') }}

      - name: Fetch third-party build inputs (hash-pinned)
        run: tools/ci/fetch_build_libs.sh ~/thepatcher-libs

      - name: Rebuild beta.38 and compare
        run: |
          python3 versions/Akashic-ThePatcher-1.1.0-beta.38-AngelicaFontCompat/tools/beta38-build.py \
            --jdk8 "${{ steps.jdk8.outputs.path }}" --jdk21 "${{ steps.jdk21.outputs.path }}" \
            --libs ~/thepatcher-libs --out "$RUNNER_TEMP/beta38.jar" --report "$RUNNER_TEMP/beta38-audit.json"
          cmp "$RUNNER_TEMP/beta38.jar" "releases/v1.1.0-beta.38-AngelicaFontCompat/!Akashic-ThePatcher-1.1.0-beta.38-AngelicaFontCompat.jar"

      - name: Rebuild beta.39 and compare
        run: |
          python3 versions/Akashic-ThePatcher-1.1.0-beta.39-AngelicaFontMixinTrust/tools/beta39-build.py \
            --jdk8 "${{ steps.jdk8.outputs.path }}" --jdk21 "${{ steps.jdk21.outputs.path }}" \
            --libs ~/thepatcher-libs --out "$RUNNER_TEMP/beta39.jar" --report "$RUNNER_TEMP/beta39-audit.json"
          cmp "$RUNNER_TEMP/beta39.jar" "releases/v1.1.0-beta.39-AngelicaFontMixinTrust/!Akashic-ThePatcher-1.1.0-beta.39-AngelicaFontMixinTrust.jar"

      - name: Rebuild beta.40 and compare
        run: |
          python3 versions/Akashic-ThePatcher-1.1.0-beta.40-ItemsAtlasAngelicaGuard/tools/beta40-build.py \
            --jdk8 "${{ steps.jdk8.outputs.path }}" --jdk21 "${{ steps.jdk21.outputs.path }}" \
            --libs ~/thepatcher-libs --out "$RUNNER_TEMP/beta40.jar" --report "$RUNNER_TEMP/beta40-audit.json"
          cmp "$RUNNER_TEMP/beta40.jar" "releases/v1.1.0-beta.40-ItemsAtlasAngelicaGuard/!Akashic-ThePatcher-1.1.0-beta.40-ItemsAtlasAngelicaGuard.jar"

      - name: Rebuild beta.41 and compare
        run: |
          python3 versions/Akashic-ThePatcher-1.1.0-beta.41-RenderCrashRecovery/tools/beta41-build.py \
            --jdk8 "${{ steps.jdk8.outputs.path }}" --jdk21 "${{ steps.jdk21.outputs.path }}" \
            --libs ~/thepatcher-libs --out "$RUNNER_TEMP/beta41.jar" --report "$RUNNER_TEMP/beta41-audit.json"
          cmp "$RUNNER_TEMP/beta41.jar" "releases/v1.1.0-beta.41-RenderCrashRecovery/!Akashic-ThePatcher-1.1.0-beta.41-RenderCrashRecovery.jar"

      - name: Rebuild beta.42 and compare
        run: |
          python3 versions/Akashic-ThePatcher-1.1.0-beta.42-MiraiShaderBridge/tools/beta42-build.py \
            --jdk8 "${{ steps.jdk8.outputs.path }}" --jdk21 "${{ steps.jdk21.outputs.path }}" \
            --libs ~/thepatcher-libs --out "$RUNNER_TEMP/beta42.jar" --report "$RUNNER_TEMP/beta42-audit.json"
          cmp "$RUNNER_TEMP/beta42.jar" "releases/v1.1.0-beta.42-MiraiShaderBridge/!Akashic-ThePatcher-1.1.0-beta.42-MiraiShaderBridge.jar"

      - name: Build the artifacts of the newest build (jar, dev, sources, checksums)
        run: |
          python3 tools/ci/make_artifacts.py --libs ~/thepatcher-libs --java "${{ steps.jdk21.outputs.path }}" \
            --out "$RUNNER_TEMP/artifacts"
          cd "$RUNNER_TEMP/artifacts" && sha256sum -c SHA256SUMS.txt
          echo "STEM=$(basename "$(ls *-dev.jar)" -dev.jar)" >> "$GITHUB_ENV"

      # One artifact per file, uploaded as-is (archive: false): each one downloads as the file itself, not a zip.
      - name: Artifact - jar
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/artifacts/${{ env.STEM }}.jar
          archive: false
          if-no-files-found: error

      - name: Artifact - dev jar
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/artifacts/${{ env.STEM }}-dev.jar
          archive: false
          if-no-files-found: error

      - name: Artifact - sources jar
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/artifacts/${{ env.STEM }}-sources.jar
          archive: false
          if-no-files-found: error

      - name: Artifact - checksums
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/artifacts/SHA256SUMS.txt
          archive: false
          if-no-files-found: error

      # The elytra fix (Et Futurum x ChromatiCraft x PlayerAPI) as its own coremod JAR; beta.42's folded-in copy
      # arms before ChromatiCraft registers its transformer, so this JAR is still needed next to beta.42.
      - name: Artifact - Akashic-ChromaPlayerApiPreloadFix jar
        run: cd projects/Akashic-ChromaPlayerApiPreloadFix/dist && sha256sum -c SHA256SUMS.txt

      - name: Artifact - Akashic-ChromaPlayerApiPreloadFix jar (upload)
        uses: actions/upload-artifact@v7
        with:
          path: projects/Akashic-ChromaPlayerApiPreloadFix/dist/Akashic-ChromaPlayerApiPreloadFix-1.0.0.jar
          archive: false
          if-no-files-found: error

      # Server-only guard: plugin GUIs (Crucible) lost items to InventoryTweaks' and Avaritiaddons' own click packets.
      - name: Rebuild Akashic-ContainerClickGuard and compare
        run: |
          L=~/thepatcher-libs
          python3 projects/Akashic-ContainerClickGuard/build.py --javac "${{ steps.jdk21.outputs.path }}/bin/javac" \
            --cp "$L/forge-universal.jar:$L/launchwrapper-1.12.jar:$L/asm-all-5.0.3.jar:$L/log4j-api.jar" \
            --out "$RUNNER_TEMP/containerclickguard.jar"
          cmp "$RUNNER_TEMP/containerclickguard.jar" projects/Akashic-ContainerClickGuard/dist/Akashic-ContainerClickGuard-1.0.0-serveronly.jar
          cd projects/Akashic-ContainerClickGuard/dist && sha256sum -c SHA256SUMS.txt

      - name: Artifact - Akashic-ContainerClickGuard jar (upload)
        uses: actions/upload-artifact@v7
        with:
          path: projects/Akashic-ContainerClickGuard/dist/Akashic-ContainerClickGuard-1.0.0-serveronly.jar
          archive: false
          if-no-files-found: error

  release:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/publish_releases.py
